    <meta charset="UTF-8" />

    <meta name="description" content="A distinctive, editorial personal portfolio for Onkar Patil — Computer Science student focused on AI/ML, backend engineering, and software systems. Designed with an engineer's field notebook aesthetic." />

    <meta property="og:title" content="Onkar Patil — Software Engineer & Machine Learning" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              serif: ['Newsreader', 'Georgia', 'serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            colors: {
              paper: {
                DEFAULT: '#F7F6F2',
                card: '#FFFFFF',
                subtle: '#F0EFEA',
                border: '#E2DFD5',
                darkborder: '#CFCABF',
              },
              ink: {
                DEFAULT: '#191919',
                secondary: '#57554E',
                muted: '#87847B',
                faint: '#B8B5AB',
              },
              cobalt: {
                DEFAULT: '#3455DB',
                hover: '#2642B5',
                wash: '#EEF2FF',
                faint: 'rgba(52, 85, 219, 0.08)',
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Field notebook clean custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #F7F6F2;
      }
      ::-webkit-scrollbar-thumb {
        background: #D8D4C8;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #B8B3A4;
      }
      
      /* Subtle grid paper pattern */
      .bg-notebook-grid {
        background-color: #F7F6F2;
        background-image: linear-gradient(to right, rgba(25, 25, 25, 0.035) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(25, 25, 25, 0.035) 1px, transparent 1px);
        background-size: 32px 32px;
      }

      /* Monospace numbers default tabular */
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }
    </style>
  <script type="importmap">
{
  "imports": {

  }
}
</script>
